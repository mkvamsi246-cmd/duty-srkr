<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Invigilation System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===================== LOGIN SCREEN ===================== -->
<div id="login-screen" class="login-screen">
    <div class="login-container">
        <form id="login-form" class="login-card">
            <div class="login-header">
                <img src="img/srkr-logo.png" alt="SRKR Engineering College Logo" class="srkr-logo-img">
                <h1 class="login-title">Smart Invigilation System</h1>
                <div class="badge-tag" style="margin-top:8px;">DEPARTMENTAL PORTAL</div>
            </div>

            <div class="login-body">
                <div class="field">
                    <label class="field-label" for="login-username">Department Username</label>
                    <div class="input-wrapper">
                        <svg width="18" height="18" fill="none" stroke="#64748b" stroke-width="2" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        <input type="text" id="login-username" class="input" placeholder="user login" autocomplete="username" required>
                    </div>
                </div>

                <div class="field">
                    <label class="field-label" for="login-password">Password</label>
                    <div class="input-wrapper">
                        <svg width="18" height="18" fill="none" stroke="#64748b" stroke-width="2" viewBox="0 0 24 24"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                        <input type="password" id="login-password" class="input" placeholder="••••••••" autocomplete="current-password" required style="padding-right: 44px;">
                        <button type="button" id="toggle-password-btn" class="toggle-password-btn" title="Toggle password visibility">
                            <svg id="eye-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block login-btn">
                    Sign In to Department Workspace &rarr;
                </button>

                <div id="login-status" class="login-status-msg hidden"></div>
                <p id="login-error" class="error-text"></p>
            </div>
        </form>
    </div>
</div>

<!-- ===================== APP SHELL ===================== -->
<div id="app-shell" class="app-shell hidden">

    <aside class="sidebar" id="app-sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand-wrapper">
                <img src="img/srkr-logo.png" alt="SRKR Logo" class="sidebar-logo">
                <div class="sidebar-brand">SRKR <span>Invigilation System</span></div>
            </div>
            <button id="mobile-sidebar-close" class="btn btn-sm mobile-only" style="display:none;background:transparent;color:#fff;border:none;font-size:22px;padding:4px 8px;cursor:pointer;">&times;</button>
        </div>
        <div id="user-dept-badge" class="user-dept-badge">
            <span class="online-indicator"></span>
            <span id="user-dept-text">Logged in</span>
        </div>
        <nav class="sidebar-nav">
            <button class="nav-item active" data-view="dashboard">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                Dashboard
            </button>
            <button class="nav-item" data-view="faculty">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                Faculty
            </button>
            <button class="nav-item" data-view="exams">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                Exam Sessions
            </button>
            <button class="nav-item" data-view="generate">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L5.6 15.11a2 2 0 00-2.001 2.001v.89a2 2 0 002 2h12.8a2 2 0 002-2v-.89a2 2 0 00-.972-1.683zM12 11a4 4 0 100-8 4 4 0 000 8z"/></svg>
                Generate Duties
            </button>
            <button class="nav-item" data-view="dutysheet">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                Duty Sheet Export
            </button>
            <button class="nav-item" data-view="import">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                Import Data
            </button>
            <button class="nav-item" data-view="settings">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                Settings
            </button>
        </nav>
        <button id="logout-btn" class="nav-item nav-item-logout">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
            Log Out
        </button>
    </aside>

    <div id="sidebar-overlay" class="sidebar-overlay hidden"></div>

    <main class="main-content">
        <header class="topbar">
            <div class="topbar-left">
                <button id="mobile-menu-toggle" class="mobile-only" style="display:none;background:#f1f5f9;border:1px solid #cbd5e1;border-radius:6px;padding:6px 12px;font-size:18px;cursor:pointer;line-height:1;">☰</button>
                <div>
                    <h2 id="view-title" class="topbar-title">Dashboard</h2>
                </div>
            </div>
            <div class="topbar-right">
                <img src="img/srkr-logo.png" alt="SRKR Logo" class="topbar-srkr-logo">
            </div>
        </header>
        <div id="view-container" class="view-container">
            <!-- Views are rendered here by app.js -->
        </div>
    </main>
</div>

<div id="toast" class="toast hidden"></div>

<script src="js/api.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/faculty.js"></script>
<script src="js/views/classrooms.js"></script>
<script src="js/views/exams.js"></script>
<script src="js/views/generate.js"></script>
<script src="js/views/dutysheet.js"></script>
<script src="js/views/import.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
