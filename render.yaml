services:
  - type: web
    name: duty-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: duty-db
          property: connectionString

databases:
  - name: duty-db
    databaseName: duty
    user: duty_user
    plan: free
